name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check and offline bundle (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install pinned package manager
        run: npm install --global pnpm@12.15.0
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Build, type-check and deterministic tests
        run: pnpm check
      - name: Build platform-local distribution
        run: pnpm bundle .local/ci-bundle
      - name: Verify offline distribution without Provider credentials
        run: node --import tsx scripts/accept-bundle.ts .local/ci-bundle --offline

  audit:
    name: Known dependency advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm install --global pnpm@12.15.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod
      - run: pnpm audit
