name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      prepare_artifacts:
        description: Prepare downloadable candidate artifacts (no release, image push or deployment)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check and offline bundle (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install pinned package manager
        run: npm install --global pnpm@12.15.0
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Build, type-check and deterministic tests
        run: pnpm check
      - name: Build platform-local distribution
        run: pnpm bundle .local/ci-bundle
      - name: Verify offline distribution without Provider credentials
        run: node --import tsx scripts/accept-bundle.ts .local/ci-bundle --offline
      - name: Build Linux server image locally (never push or run)
        if: github.event_name == 'workflow_dispatch' && inputs.prepare_artifacts && runner.os == 'Linux'
        run: docker build -t "harness-dock-server:$GITHUB_SHA" .local/ci-bundle/server
      - name: Prepare local candidate archives
        if: github.event_name == 'workflow_dispatch' && inputs.prepare_artifacts
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            pnpm package:local --bundles .local/ci-bundle --output .local/ci-artifacts --server-image "harness-dock-server:$GITHUB_SHA"
          else
            test "$(node -p process.arch)" = arm64
            pnpm package:local --bundles .local/ci-bundle --output .local/ci-artifacts
          fi
      - name: Retain candidate artifacts for explicit download
        if: github.event_name == 'workflow_dispatch' && inputs.prepare_artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-${{ matrix.os }}-${{ github.sha }}
          path: .local/ci-artifacts/
          retention-days: 14
          if-no-files-found: error

  audit:
    name: Known dependency advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm install --global pnpm@12.15.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod
      - run: pnpm audit
