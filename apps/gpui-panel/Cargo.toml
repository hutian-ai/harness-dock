[package]
name = "harness-dock-panel"
version = "0.1.3"
edition = "2024"
publish = false
license = "MIT"

[dependencies]
chrono = "=0.4.45"
gpui-kit = "=0.9.0"
serde_json = "1"
tray-icon = { version = "=0.26.1", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
strip = "symbols"
